name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Flutter Pub Get
        run: flutter pub get

      - name: 🍏 Build iOS IPA (No Codesign)
        run: flutter build ipa --no-codesign

      - name: 🗜️ Package into IPA
        run: |
          mkdir -p Payload
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
            zip -r Makera_Pass_iOS.ipa Payload
          elif [ -f "build/ios/ipa/*.ipa" ]; then
            cp build/ios/ipa/*.ipa Makera_Pass_iOS.ipa
          fi

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makera-Pass-iOS-Build
          path: |
            Makera_Pass_iOS.ipa
            build/ios/archive/Runner.xcarchive
          retention-days: 14
