name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Flutter Pub Get & Dependencies
        run: |
          flutter pub get
          flutter build ios --config-only

      - name: 🍏 CocoaPods Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🏗️ Native Xcode Compilation (Bypass Team Requirement)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=../build/ios \
            build
          cd ..

      - name: 🗜️ Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r Makera_Pass_iOS.ipa Payload

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makera-Pass-iOS-Build
          path: Makera_Pass_iOS.ipa
          retention-days: 14
