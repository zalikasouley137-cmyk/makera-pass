name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Flutter Pub Get
        run: flutter pub get

      - name: 🍏 Build iOS Application Package
        run: |
          flutter build ios --simulator --release

      - name: 🗜️ Package into IPA & Zip
        run: |
          mkdir -p Payload
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -r Makera_Pass_iOS.ipa Payload
          cd build/ios/iphonesimulator
          zip -r ../../../Makera_Pass_iOS_Runner.zip Runner.app
          cd ../../..

      - name: 📤 Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Makera-Pass-iOS-Build
          path: |
            Makera_Pass_iOS.ipa
            Makera_Pass_iOS_Runner.zip
          retention-days: 14
